# Run the test suite on each supported Python version, and build the
# distributions. For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install HDF5 headers (for building h5py when no wheel exists)
      if: matrix.python-version == '3.15'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libhdf5-dev pkg-config
    - name: Install the package and dev dependencies
      run: uv sync --locked --all-extras
    - name: Test with pytest
      run: uv run --locked pytest

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    - name: Build sdist and wheel
      run: uv build
    - name: Smoke-test the built wheel
      run: |
        uv run --isolated --no-project --with dist/*.whl python -c "import bioread; print(bioread.__version__)"
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
