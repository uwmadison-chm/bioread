[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[project]
name = "bioread"
version = "2025.05.02"
description = "Utilities to read BIOPAC AcqKnowledge files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [{ name = "Nate Vack", email = "njvack@wisc.edu" }]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=5.5",
    "numpy>=2.2.3",
]

[project.optional-dependencies]
mat = ["scipy>=1.13"]
hdf5 = ["h5py>=3.11"]
all = ["scipy>=1.13", "h5py>=3.11"]

[project.urls]
Homepage = "https://github.com/uwmadison-chm/bioread"
Repository = "https://github.com/uwmadison-chm/bioread"
Changelog = "https://github.com/uwmadison-chm/bioread/blob/main/CHANGELOG"

[project.scripts]
bioread = "bioread.cli:main"
acq_info = "bioread.runners.acq_info:main"
acq_markers = "bioread.runners.acq_markers:main"
acq2txt = "bioread.runners.acq2txt:main"
acq2hdf5 = "bioread.runners.acq2hdf5:main"
acq2mat = "bioread.runners.acq2mat:main"
acq_layout = "bioread.runners.acq_layout:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "scipy>=1.13",
    "h5py>=3.11",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# The header tables use the revision constants (V_400B, ...) unqualified.
"src/bioread/headers.py" = ["F403", "F405"]
# A notebook-style walkthrough: bare expressions show values on purpose.
"examples/*" = ["B018", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["bioread"]
