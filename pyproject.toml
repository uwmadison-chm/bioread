[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "bioread"
version = "2025.05.02"
description = "Utilities to read BIOPAC AcqKnowledge files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [{ name = "Nate Vack", email = "njvack@wisc.edu" }]
requires-python = ">=3.11"
dependencies = [
    "docopt>=0.6.1",
    "numpy>=2.2.3",
]

[project.optional-dependencies]
mat = ["scipy"]
hdf5 = ["h5py"]
all = ["scipy", "h5py"]

[project.urls]
Homepage = "https://github.com/uwmadison-chm/bioread"
Repository = "https://github.com/uwmadison-chm/bioread"
Changelog = "https://github.com/uwmadison-chm/bioread/blob/main/CHANGELOG"

[project.scripts]
acq_info = "bioread.runners.acq_info:main"
acq_markers = "bioread.runners.acq_markers:main"
acq2txt = "bioread.runners.acq2txt:main"
acq2hdf5 = "bioread.runners.acq2hdf5:main"
acq2mat = "bioread.runners.acq2mat:main"
acq_layout = "bioread.runners.acq_layout:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "scipy",
    "h5py",
]

[tool.uv.build-backend]
module-root = ""
source-exclude = ["test", "notes", "examples"]
